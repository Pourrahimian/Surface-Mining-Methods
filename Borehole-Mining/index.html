<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borehole Mining (BHM): 3D Views of the Three Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2329; --muted:#5d6670; --line:#d7dce2; --panel:rgba(255,255,255,.94);
    --green:#11902a; --blue:#1d5fd1; --accent:#11902a; --chip:#eef2f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#f4f6f8}
  body{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;overflow:hidden}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;
    padding:14px 22px 10px;background:#fff;border-bottom:1px solid var(--line)}
  .titles h1{margin:0;font-family:"Roboto Condensed",sans-serif;font-weight:600;font-size:30px;line-height:1.1;color:var(--green)}
  .titles h1 small{font-size:18px;color:var(--muted);font-weight:400;margin-left:6px}
  .author{margin-top:4px;font-family:"Roboto Condensed",sans-serif;font-size:19px;font-weight:600;color:var(--blue);letter-spacing:.2px}
  .tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;padding:8px 14px;border-radius:7px;font:500 14px Inter,sans-serif;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tabs button:hover{color:var(--ink)}
  main{position:relative;min-height:0;background:radial-gradient(ellipse at 50% 20%,#ffffff 0%,#e8edf2 70%,#dfe5eb 100%)}
  #viewport{position:absolute;inset:0}
  #viewport canvas{display:block;outline:none}
  .hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.75);padding:4px 9px;border-radius:6px;pointer-events:none}
  .scale-note{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.75);padding:4px 9px;border-radius:6px;pointer-events:none}
  #info{position:absolute;top:12px;right:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 6px 24px rgba(20,30,40,.10);font-size:13.5px;line-height:1.45}
  #info.hidden{display:none}
  #info h2{margin:0 0 6px;font-family:"Roboto Condensed",sans-serif;font-size:21px;color:var(--green);font-weight:600}
  #info h3{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #info ul{margin:0;padding-left:18px}
  #info li{margin:3px 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:4px 0 2px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
  table.cmp{border-collapse:collapse;width:100%;font-size:12.5px}
  table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
  table.cmp th{color:var(--muted);font-weight:500}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
  details summary{cursor:pointer;font-weight:600;margin-top:12px}
  details p, details ul{margin-top:6px}
  footer.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 18px;background:#fff;border-top:1px solid var(--line);font-size:13.5px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:500 13.5px Inter,sans-serif;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f3f6f8}
  #play{width:44px;font-size:15px}
  .prog{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:220px}
  .prog input{flex:1;accent-color:var(--green)}
  .prog output{width:40px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 11px;font:500 13px Inter,sans-serif;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--green);color:#fff}
  .grp{display:flex;align-items:center;gap:6px;color:var(--muted)}
  select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 13px Inter,sans-serif;background:#fff}
  label.chk{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  label.chk input{accent-color:var(--green)}
  /* 3D labels */
  .lbl{pointer-events:none;white-space:nowrap}
  .lbl > span{display:inline-block;font:500 12px Inter,sans-serif;color:#1d2329;background:rgba(255,255,255,.88);
    border:1px solid rgba(0,0,0,.12);border-radius:5px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .lbl.r > span{transform:translateX(56%)}
  .lbl.strata > span{background:rgba(255,255,255,.72);font-weight:600}
  .lbl.water > span{color:#164fa8;border-color:#9cc0f3}
  .lbl.slurry > span{color:#6b3f15;border-color:#d9b48c}
  .lbl.note > span{background:#fff8e1;border-color:#e8c766}
  .lbl.title > span{font:600 20px "Roboto Condensed",sans-serif;color:var(--green);padding:3px 12px}
  #err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted)}
  @media (max-width:820px){
    #info{width:auto;left:12px;right:12px;top:auto;bottom:40px;max-height:45%}
    .titles h1{font-size:24px} .titles h1 small{display:block;margin:2px 0 0;font-size:15px}
    .author{font-size:17px}
  }
</style>
</head>
<body>
<header>
  <div class="titles">
    <h1>Borehole Mining (BHM) <small>3D views of the three jetting methods</small></h1>
    <div class="author">Yashar Pourrahimian</div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Method">
    <button role="tab" data-key="top-down">Top-Down</button>
    <button role="tab" data-key="bottom-up">Bottom-Up</button>
    <button role="tab" data-key="stationary">Stationary (rotation only)</button>
    <button role="tab" data-key="compare">Compare all</button>
  </nav>
</header>

<main id="stage">
  <div id="viewport"></div>
  <div class="scale-note">Schematic, not to scale</div>
  <aside id="info" aria-live="polite"></aside>
  <div class="hint">Drag to rotate · Scroll / pinch to zoom · Right-drag to pan</div>
  <div id="err">The 3D view could not start. It needs a browser with WebGL enabled.</div>
</main>

<footer class="controls">
  <button class="btn" id="play" title="Play / pause (space)">❚❚</button>
  <label class="prog">Mining progress
    <input type="range" id="prog" min="0" max="1000" value="350" aria-label="Mining progress">
    <output id="pct">35%</output>
  </label>
  <div class="grp">Speed
    <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  </div>
  <div class="seg" id="mode" title="Section: block cut in half · X-ray: transparent ground, solid cavity">
    <button data-mode="section" class="on">Section</button><button data-mode="xray">X-ray</button>
  </div>
  <div class="seg" id="views">
    <button data-view="iso">3D</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="plan">Plan</button>
  </div>
  <label class="chk"><input type="checkbox" id="lbls" checked> Labels</label>
  <label class="chk"><input type="checkbox" id="rot"> Auto-rotate</label>
  <button class="btn" id="infoBtn">Hide info</button>
</footer>
